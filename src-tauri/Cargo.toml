[package]
name = "onlinefix-launcher"
version = "0.3.4"
description = "Лаунчер игр FreeTP / Online-Fix для Linux: торрент, Proton, Steam (Spacewar 480)"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "linfix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
librqbit = "9"
reqwest = { version = "0.13", features = ["json", "stream", "cookies", "multipart"] }
futures-util = "0.3"
anyhow = "1"
dirs = "6"
regex = "1"
walkdir = "2"
urlencoding = "2"
parking_lot = "0.12"
fs4 = "1.1.0"
tauri-plugin-updater = "2.14.1"

# Зависимости (торрент-движок, хеширование) оптимизируем и в debug-сборке,
# иначе загрузка упирается в медленную проверку кусков и скорость скачет.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
