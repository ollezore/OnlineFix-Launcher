# Тестовая сборка: push в ветку test → AppImage в артефактах запуска (без релиза и подписи).
name: Test build

on:
  push:
    branches: [test]
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libssl-dev cmake clang

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Сборка AppImage
        run: npx tauri build --bundles appimage -c '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: OnlineFix-Launcher-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30
