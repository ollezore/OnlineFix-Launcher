# Быстрая проверка на каждый push / pull request: Rust компилируется, тесты проходят, JS без синтаксических ошибок.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
      - name: JS
        run: for f in ui/*.js; do node --check "$f"; done
